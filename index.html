<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mystic Tarot - สำนักสักยันต์รัตนเกล้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
      min-height: 100vh;
      color: #f8fafc;
    }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .deck-card-item {
      position: relative;
      background: linear-gradient(135deg, #312e81 0%, #1e1b4b 50%, #0f172a 100%);
      border: 2px solid #fbbf24;
      border-radius: 0.5rem;
      box-shadow: 0 4px 12px rgba(251, 191, 36, 0.2);
      transition: all 0.2s ease;
    }
    .deck-card-item:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 8px 20px rgba(251, 191, 36, 0.45);
    }
    .deck-card-item.selected {
      opacity: 0.2;
      pointer-events: none;
      transform: scale(0.88);
      border-color: #64748b;
    }
    .perspective { perspective: 1000px; }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card-flipped .card-inner { transform: rotateY(180deg); }
    .card-front, .card-back {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 0.75rem;
    }
    .card-back {
      background: linear-gradient(135deg, #312e81 0%, #1e1b4b 50%, #0f172a 100%);
      border: 2px solid #fbbf24;
    }
    .card-front {
      transform: rotateY(180deg);
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #f59e0b;
    }
    .reversed-icon { transform: rotate(180deg); }
    .celtic-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(68px, 105px));
      grid-template-rows: repeat(4, auto);
      gap: 0.75rem;
      justify-content: center;
      align-items: center;
    }
    .pos-5 { grid-column: 2; grid-row: 1; }
    .pos-4 { grid-column: 1; grid-row: 2 / span 2; }
    .pos-center { grid-column: 2; grid-row: 2 / span 2; position: relative; }
    .pos-6 { grid-column: 3; grid-row: 2 / span 2; }
    .pos-3 { grid-column: 2; grid-row: 4; }
    .pos-10 { grid-column: 4; grid-row: 1; }
    .pos-9  { grid-column: 4; grid-row: 2; }
    .pos-8  { grid-column: 4; grid-row: 3; }
    .pos-7  { grid-column: 4; grid-row: 4; }
    .crossing-card {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
      z-index: 10;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.85);
    }
    .crossing-card:hover {
      transform: translate(-50%, -50%) rotate(0deg) scale(1.1);
      z-index: 20;
    }
  </style>
</head>
<body class="p-4 md:p-8 flex flex-col min-h-screen">

  <div class="max-w-6xl mx-auto flex-grow w-full">
    <header class="text-center mb-8">
      <p class="text-amber-400 tracking-widest text-sm uppercase font-cinzel mb-1">Celestial Guidance</p>
      <h1 class="text-3xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-200 font-cinzel leading-tight">
        MYSTIC TAROT ONLINE
      </h1>
      <!-- เพิ่มชื่อสำนักสักยันต์รัตนเกล้า -->
      <h2 class="text-xl md:text-2xl font-semibold text-amber-500 mt-2 mb-3 drop-shadow-md">
        สำนักสักยันต์รัตนเกล้า
      </h2>
      <p class="text-slate-400 mt-3 text-sm md:text-base">ตั้งจิตอธิษฐาน เลือกโหมดการทำนาย แล้วหยิบไพ่ด้วยสัญชาตญาณของคุณ (สำรับ 78 ใบ)</p>
    </header>

    <section class="bg-slate-900/70 backdrop-blur-md border border-slate-800 rounded-2xl p-6 mb-8 shadow-xl">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        <div class="md:col-span-2">
          <label class="block text-sm text-amber-300 mb-2">คำถามในใจของคุณ (ระบุหรือไม่ก็ได้)</label>
          <input id="questionInput" type="text" placeholder="เช่น การงานในเดือนนี้จะเป็นอย่างไร, ความรักที่กำลังคุยอยู่..." 
            class="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 transition">
        </div>
        <div>
          <label class="block text-sm text-amber-300 mb-2">รูปแบบการเปิดไพ่</label>
          <select id="spreadMode" onchange="resetSession()" 
            class="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-400 transition">
            <option value="1">ไพ่ 1 ใบ (ดูดวงรายวัน / ฟันธง)</option>
            <option value="3" selected>ไพ่ 3 ใบ (อดีต - ปัจจุบัน - อนาคต)</option>
            <option value="10">ไพ่ 10 ใบ (Celtic Cross เจาะลึก)</option>
          </select>
        </div>
      </div>

      <div class="flex flex-wrap justify-between items-center mt-6 pt-4 border-t border-slate-800 gap-4">
        <div id="statusText" class="text-sm text-amber-200 font-medium">
          กำลังเตรียมสำรับไพ่...
        </div>
        <button type="button" onclick="resetSession()" 
          class="bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-semibold px-6 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2">
          <span>🔄</span> สับไพ่ใหม่
        </button>
      </div>
    </section>

    <section id="deckContainer" class="mb-10 bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4">
      <div id="deckGrid" class="grid grid-cols-6 sm:grid-cols-8 md:grid-cols-10 lg:grid-cols-13 gap-2.5 justify-items-center"></div>
    </section>

    <section id="readingSection" class="hidden">
      <h2 class="text-2xl font-semibold text-center text-amber-300 mb-6 font-cinzel">✦ คำทำนายของคุณ ✦</h2>
      <div id="questionDisplay" class="text-center text-slate-300 italic mb-6"></div>
      <div id="celticBoardContainer" class="hidden mb-12 overflow-x-auto py-2"></div>
      <div id="selectedCardsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6 justify-items-center mb-8"></div>
    </section>
  </div>

  <!-- เพิ่ม Footer ลิขสิทธิ์ -->
  <footer class="w-full text-center text-slate-500/80 text-sm mt-12 pb-6 border-t border-slate-800/50 pt-6">
    Copyright &copy; สำนักสักยันต์รัตนเกล้า
  </footer>

  <script>

      ["Seven of Pentacles","🌾","Pentacles","รอคอยผลตอบแทนจากการลงทุน ประเมินผลงาน","ใจร้อนอยากเห็นผลเร็ว ลงแรงผิดจุด ผลตอบแทนน้อย","ความสำเร็จต้องใช้เวลา หมั่นตรวจสอบและปรับแผน"],
      ["Eight of Pentacles","🔨","Pentacles","ขยันขันแข็ง ฝึกฝนทักษะจนเชี่ยวชาญ รายได้จากน้ำพักน้ำแรง","สมบูรณ์แบบนิยมงานไม่เดิน เบื่อหน่ายงานรูทีน","โฟกัสพัฒนาฝีมือ ความเชี่ยวชาญจะสร้างรายได้มหาศาล"],
      ["Nine of Pentacles","🦚","Pentacles","มั่งคั่งพึ่งพาตัวเองได้ ชีวิตสุขสบาย ผลกำไร","ใช้เงินเกินตัวรักษาภาพลักษณ์ ความเหงาแม้มีเงิน","ให้รางวัลตัวเอง และรักษาวินัยทางการเงินไว้"],
      ["Ten of Pentacles","🏰","Pentacles","มั่งคั่งมรดก ธุรกิจครอบครัวมั่นคง อสังหาริมทรัพย์","ปัญหาเรื่องมรดกหรือการเงินในครอบครัว ภาระค่าใช้จ่าย","วางแผนการเงินและทรัพย์สินเพื่ออนาคตระยะยาว"],
      ["Page of Pentacles","📚","Pentacles","ข่าวดีทุนการศึกษาหรือการเงิน เริ่มต้นลงทุน ตั้งใจจริง","ขาดสมาธิ ผัดวันประกันพรุ่ง โอกาสหลุดมือ","หมั่นศึกษาหาความรู้เพิ่มมูลค่าให้ตัวเอง"],
      ["Knight of Pentacles","🐂","Pentacles","ความสม่ำเสมอ รับผิดชอบสูง ทำงานรอบคอบมั่นคง","เฉื่อยชา ยึดติดวิธีเดิม ไม่กล้าเสี่ยงจนเสียโอกาส","ก้าวเดินอย่างมั่นคง แต่อย่าลืมปรับตัวให้ทันสมัย"],
      ["Queen of Pentacles","🪴","Pentacles","บริหารเงินเก่ง อุดมสมบูรณ์ ดูแลครอบครัวธุรกิจลงตัว","กังวลเรื่องเงินมาก ทำงานหนักจนลืมดูแลสุขภาพ","จัดสมดุลระหว่างการหาเงินและการดูแลสุขภาพ"],
      ["King of Pentacles","👑","Pentacles","ร่ำรวยมั่นคง นักธุรกิจสำเร็จสูงสุด น่าเชื่อถือการเงิน","ความโลภ วัดคุณค่าทุกอย่างด้วยเงิน ยึดติดวัตถุ","ใช้ความมั่งคั่งสร้างคุณค่าให้ทั้งตนเองและสังคม"]
    ];

    const fullTarotDeck = rawTarotData.map((c, idx) => ({
      id: idx, name: c[0], icon: c[1], suit: c[2], upright: c[3], reversed: c[4], advice: c[5]
    }));

    const celticPositions = [
      { title: "1. ปัจจุบัน (Present)", desc: "สถานการณ์หลักและตัวตนของคุณในขณะนี้" },
      { title: "2. อุปสรรค (Obstacle)", desc: "สิ่งที่เข้ามาขวางกั้นหรือท้าทายเฉพาะหน้า" },
      { title: "3. จิตใต้สำนึก (Subconscious)", desc: "รากฐานของปัญหาหรือความรู้สึกส่วนลึก" },
      { title: "4. อดีต (Past)", desc: "เหตุการณ์ที่เพิ่งผ่านมาและส่งผลถึงปัจจุบัน" },
      { title: "5. จุดมุ่งหมาย (Goal)", desc: "สิ่งที่คุณคาดหวังหรือเป้าหมายสูงสุด" },
      { title: "6. อนาคตอันใกล้ (Near Future)", desc: "แนวโน้มเหตุการณ์ที่กำลังจะเกิดขึ้นเร็วๆ นี้" },
      { title: "7. ตัวตนภายใน (Self)", desc: "ทัศนคติและวิธีการรับมือของคุณ" },
      { title: "8. สภาพแวดล้อม (Environment)", desc: "อิทธิพลจากคนรอบข้างและบรรยากาศ" },
      { title: "9. ความรู้สึกในใจ (Hopes & Fears)", desc: "ความหวังและความกลัวที่ซ่อนอยู่" },
      { title: "10. ภาพรวม (Final Outcome)", desc: "บทสรุปและแนวโน้มผลลัพธ์สุดท้าย" }
    ];

    let shuffledDeck = [];
    let selectedCards = [];
    let maxSelection = 3;

    function shuffleDeck(deck) {
      const copy = deck.map(card => ({ ...card, isReversed: Math.random() < 0.35 }));
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function updateStatusText() {
      const remaining = maxSelection - selectedCards.length;
      const statusEl = document.getElementById('statusText');
      if (remaining > 0) {
        statusEl.innerHTML = `✨ กรุณาเลือกไพ่อีก <span class="text-amber-400 font-bold text-base">${remaining}</span> ใบจากสำรับด้านล่าง`;
      } else {
        statusEl.innerHTML = `✅ เลือกไพ่ครบแล้ว เลื่อนลงเพื่ออ่านคำทำนาย`;
      }
    }

    function renderDeck() {
      const deckGrid = document.getElementById('deckGrid');
      deckGrid.innerHTML = '';
      shuffledDeck.forEach((card, index) => {
        const cardBtn = document.createElement('button');
        cardBtn.type = 'button';
        cardBtn.className = 'deck-card-item cursor-pointer w-12 h-20 sm:w-16 sm:h-24 flex flex-col items-center justify-center select-none';
        cardBtn.innerHTML = `<div class="w-9 h-16 sm:w-12 sm:h-20 border border-amber-500/40 rounded flex flex-col items-center justify-center pointer-events-none"><span class="text-amber-400 text-base">✦</span><span class="text-[9px] text-amber-200/60 mt-1">${index + 1}</span></div>`;
        cardBtn.onclick = () => selectCard(index, cardBtn);
        deckGrid.appendChild(cardBtn);
      });
    }

    function selectCard(index, element) {
      if (selectedCards.length >= maxSelection || element.classList.contains('selected')) return;
      element.classList.add('selected');
      selectedCards.push(shuffledDeck[index]);
      updateStatusText();
      if (selectedCards.length === maxSelection) {
        setTimeout(showReading, 300);
      }
    }

    function renderMiniCard(card, index, extraClass = "") {
      return `<div onclick="document.getElementById('detail-card-${index}').scrollIntoView({behavior:'smooth'})" class="cursor-pointer w-16 h-24 sm:w-20 sm:h-28 rounded-lg bg-slate-900 border-2 border-amber-400 p-1.5 flex flex-col items-center justify-between text-center transition hover:scale-105 ${extraClass}"><span class="text-[9px] text-amber-300 font-bold bg-slate-950/80 px-1 rounded">#${index + 1}</span><div class="text-2xl ${card.isReversed ? 'reversed-icon' : ''}">${card.icon}</div><div class="text-[9px] text-white font-cinzel leading-tight line-clamp-2">${card.name}</div></div>`;
    }

    function showReading() {
      const readingSection = document.getElementById('readingSection');
      const boardContainer = document.getElementById('celticBoardContainer');
      const grid = document.getElementById('selectedCardsGrid');
      const question = document.getElementById('questionInput').value.trim();
      document.getElementById('questionDisplay').textContent = question ? `คำถามของคุณ: "${question}"` : 'คำทำนายตามพลังงานของคุณในขณะนี้';

      if (maxSelection === 10) {
        boardContainer.classList.remove('hidden');
        boardContainer.innerHTML = `<div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 max-w-3xl mx-auto"><p class="text-center text-xs text-amber-300/80 mb-6">💡 แผนผัง Celtic Cross (แตะที่ไพ่เพื่อเลื่อนดูคำทำนายละเอียด)</p><div class="celtic-board"><div class="pos-5 flex justify-center">${renderMiniCard(selectedCards[4], 4)}</div><div class="pos-4 flex justify-center">${renderMiniCard(selectedCards[3], 3)}</div><div class="pos-center flex justify-center items-center">${renderMiniCard(selectedCards[0], 0)}${renderMiniCard(selectedCards[1], 1, 'crossing-card')}</div><div class="pos-6 flex justify-center">${renderMiniCard(selectedCards[5], 5)}</div><div class="pos-3 flex justify-center">${renderMiniCard(selectedCards[2], 2)}</div><div class="pos-10 flex justify-center">${renderMiniCard(selectedCards[9], 9)}</div><div class="pos-9 flex justify-center">${renderMiniCard(selectedCards[8], 8)}</div><div class="pos-8 flex justify-center">${renderMiniCard(selectedCards[7], 7)}</div><div class="pos-7 flex justify-center">${renderMiniCard(selectedCards[6], 6)}</div></div></div>`;
      } else {
        boardContainer.classList.add('hidden');
        boardContainer.innerHTML = '';
      }

      grid.className = maxSelection === 1 ? 'grid grid-cols-1 max-w-md mx-auto gap-6 mb-8' : maxSelection === 3 ? 'grid grid-cols-1 md:grid-cols-3 gap-6 mb-8' : 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8';

      const positions = maxSelection === 1 ? [{ title: 'คำทำนายประจำตัวคุณ', desc: 'พลังงานหลักของคุณในขณะนี้' }] : maxSelection === 3 ? [{ title: '1. อดีต / พื้นฐานเรื่องราว', desc: 'ที่มาหรือปัจจัยที่ส่งผลมาถึงปัจจุบัน' }, { title: '2. ปัจจุบัน / สถานการณ์ตอนนี้', desc: 'สิ่งที่คุณกำลังเผชิญอยู่ในขณะนี้' }, { title: '3. อนาคต / แนวโน้มผลลัพธ์', desc: 'ทิศทางที่กำลังจะเกิดขึ้นต่อไป' }] : celticPositions;

      grid.innerHTML = selectedCards.map((card, idx) => {
        const badge = card.isReversed ? '<span class="px-2.5 py-0.5 text-xs rounded-full bg-rose-950 text-rose-300 border border-rose-700">ไพ่หัวกลับ (Reversed)</span>' : '<span class="px-2.5 py-0.5 text-xs rounded-full bg-emerald-950 text-emerald-300 border border-emerald-700">ไพ่หัวตั้ง (Upright)</span>';
        const meaning = card.isReversed ? card.reversed : card.upright;
        const suitLabel = card.suit ? `SUIT OF ${card.suit.toUpperCase()}` : 'MAJOR ARCANA';
        return `<div id="detail-card-${idx}" class="bg-slate-900/90 border border-amber-500/40 rounded-2xl p-6 shadow-2xl flex flex-col justify-between scroll-mt-6"><div><div class="text-center mb-4 pb-3 border-b border-slate-800"><div class="text-sm font-bold text-amber-400">${positions[idx].title}</div><div class="text-xs text-slate-400 mt-0.5">${positions[idx].desc}</div></div><div class="w-36 h-56 mx-auto mb-5 perspective" id="flip-card-${idx}"><div class="card-inner"><div class="card-back flex items-center justify-center"><span class="text-3xl text-amber-400">✦</span></div><div class="card-front flex flex-col items-center justify-between p-4 text-center"><span class="text-[10px] text-amber-400/70 font-cinzel">${suitLabel}</span><div class="text-5xl my-2 ${card.isReversed ? 'reversed-icon' : ''}">${card.icon}</div><div class="text-xs font-bold text-amber-200 font-cinzel leading-snug">${card.name}</div></div></div></div><div class="text-center mb-4"><h3 class="text-lg font-bold text-white font-cinzel mb-1">${card.name}</h3>${badge}</div><div class="space-y-2.5 text-sm text-slate-300 border-t border-slate-800 pt-4"><p><strong class="text-amber-300">ความหมายไพ่:</strong> ${meaning}</p><p><strong class="text-amber-300">คำแนะนำ:</strong> ${card.advice}</p></div></div></div>`;
      }).join('');

      readingSection.classList.remove('hidden');
      readingSection.scrollIntoView({ behavior: 'smooth' });
      selectedCards.forEach((_, idx) => {
        setTimeout(() => {
          const el = document.getElementById(`flip-card-${idx}`);
          if (el) el.classList.add('card-flipped');
        }, 180 * (idx + 1));
      });
    }

    function resetSession() {
      maxSelection = parseInt(document.getElementById('spreadMode').value, 10) || 3;
      shuffledDeck = shuffleDeck(fullTarotDeck);
      selectedCards = [];
      document.getElementById('readingSection').classList.add('hidden');
      document.getElementById('selectedCardsGrid').innerHTML = '';
      document.getElementById('celticBoardContainer').innerHTML = '';
      updateStatusText();
      renderDeck();
    }

    resetSession();
  </script>
</body>
</html>
